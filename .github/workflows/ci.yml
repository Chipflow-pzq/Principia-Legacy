name: Verify atlas
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[authoring,test]"
      - run: python -m pytest -vv -o faulthandler_timeout=60
        timeout-minutes: 5
      - run: python start.py validate corpus/
      - run: python start.py build --release 1.4.1-exploratory --offline
      - run: python start.py doctor
